name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-desktop:
    name: Windows desktop
    runs-on: windows-latest
    defaults:
      run:
        working-directory: LanFileTransfer
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_mingw
          modules: qtmultimedia
          tools: tools_mingw1310
          cache: true
          cache-key-prefix: qt-desktop

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build/ci-desktop -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build build/ci-desktop --parallel 2

      - name: Test
        shell: pwsh
        run: ctest --test-dir build/ci-desktop --output-on-failure

      - name: Verify deployment
        shell: pwsh
        run: cmake --build build/ci-desktop --target landrop_deploy_windows_runtime

  android-arm64:
    name: Android arm64 compile
    runs-on: windows-latest
    defaults:
      run:
        working-directory: LanFileTransfer
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Qt host tools
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_mingw
          modules: qtmultimedia
          tools: tools_mingw1310
          dir: ${{ runner.temp }}/Qt
          cache: true
          cache-key-prefix: qt-android-host

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: android
          arch: android_arm64_v8a
          modules: qtmultimedia
          dir: ${{ runner.temp }}/Qt
          cache: true
          cache-key-prefix: qt-android-target

      - name: Install Android build packages
        shell: pwsh
        run: |
          & "$env:ANDROID_SDK_ROOT\cmdline-tools\latest\bin\sdkmanager.bat" `
            'platforms;android-36' 'build-tools;36.0.0' 'ndk;26.1.10909125'

      - name: Build Debug APK
        shell: pwsh
        run: |
          ./build-android.ps1 `
            -Configuration Debug `
            -Package Apk `
            -QtAndroidRoot "${{ runner.temp }}\Qt\6.8.3\android_arm64_v8a" `
            -AndroidSdkRoot "$env:ANDROID_SDK_ROOT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LanDrop-android-arm64-debug
          path: LanFileTransfer/build/android-arm64-v8a-debug/android-build/build/outputs/apk/debug/*.apk
          if-no-files-found: error
